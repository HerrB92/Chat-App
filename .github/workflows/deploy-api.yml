name: Deploy chat-api

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/chat-api/**'
      - 'packages/**'
      - 'Dockerfile.api'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ziel-Umgebung'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bei ACR anmelden (via MI — kein Passwort)
        run: az acr login --name chatappacr

      - name: Image-Tag bestimmen (Kurzform des Commit SHA)
        id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Docker Build & Push
        run: |
          docker build \
            -f Dockerfile.api \
            -t chatappacr.azurecr.io/chat-api:${{ steps.meta.outputs.image_tag }} \
            -t chatappacr.azurecr.io/chat-api:latest \
            .
          docker push chatappacr.azurecr.io/chat-api:${{ steps.meta.outputs.image_tag }}
          docker push chatappacr.azurecr.io/chat-api:latest

  deploy-dev:
    name: Deploy → Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Neue Revision deployen
        run: |
          az containerapp update \
            --name ca-trainbb-chat-api-dev \
            --resource-group rg-trainbb-chat-app-dev \
            --image chatappacr.azurecr.io/chat-api:${{ needs.build.outputs.image_tag }}

      - name: Deployment prüfen
        run: |
          az containerapp show \
            --name ca-trainbb-chat-api-dev \
            --resource-group rg-trainbb-chat-app-dev \
            --query "properties.latestRevisionName" -o tsv

  deploy-test:
    name: Deploy → Test
    needs: build
    runs-on: ubuntu-latest
    environment: test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Neue Revision deployen
        run: |
          az containerapp update \
            --name ca-trainbb-chat-api-test \
            --resource-group rg-trainbb-chat-app-test \
            --image chatappacr.azurecr.io/chat-api:${{ needs.build.outputs.image_tag }}

  deploy-prod:
    name: Deploy → Prod
    needs: [build, deploy-test]
    runs-on: ubuntu-latest
    environment: prod    # Erfordert manuelle Freigabe durch Required Reviewers
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Neue Revision deployen
        run: |
          az containerapp update \
            --name ca-trainbb-chat-api-prod \
            --resource-group rg-trainbb-chat-app-prod \
            --image chatappacr.azurecr.io/chat-api:${{ needs.build.outputs.image_tag }}
