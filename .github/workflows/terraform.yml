name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write      # OIDC JWT Token
  contents: read
  pull-requests: write # Terraform Plan als PR-Kommentar

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ── Dev: Plan auf PR, Apply auf Push nach develop ──────────────────────────
  terraform-dev:
    name: "Terraform Dev"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID_DEV }}
          TF_VAR_entra_audience: ${{ secrets.ENTRA_AUDIENCE_DEV }}
          TF_VAR_web_entra_client_id: ${{ secrets.WEB_ENTRA_CLIENT_ID_DEV }}
          TF_VAR_web_entra_scope: ${{ secrets.WEB_ENTRA_SCOPE_DEV }}
          TF_VAR_acr_login_server: ${{ secrets.ACR_LOGIN_SERVER }}
          TF_VAR_acr_id: ${{ secrets.ACR_ID }}
          TF_VAR_log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          TF_VAR_github_sp_object_id: ${{ secrets.GITHUB_SP_OBJECT_ID }}

      - name: Plan als PR-Kommentar posten
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/dev/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Terraform Plan: \`dev\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: terraform apply tfplan

  # ── Test: Plan auf PR, Apply auf Push nach main ────────────────────────────
  terraform-test:
    name: "Terraform Test"
    runs-on: ubuntu-latest
    environment: test
    needs: terraform-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra/environments/test
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan & Apply
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan
          terraform apply tfplan
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID_TEST }}
          TF_VAR_entra_audience: ${{ secrets.ENTRA_AUDIENCE_TEST }}
          TF_VAR_web_entra_client_id: ${{ secrets.WEB_ENTRA_CLIENT_ID_TEST }}
          TF_VAR_web_entra_scope: ${{ secrets.WEB_ENTRA_SCOPE_TEST }}
          TF_VAR_acr_login_server: ${{ secrets.ACR_LOGIN_SERVER }}
          TF_VAR_acr_id: ${{ secrets.ACR_ID }}
          TF_VAR_log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          TF_VAR_github_sp_object_id: ${{ secrets.GITHUB_SP_OBJECT_ID }}

  # ── Prod: Apply nur nach manueller Freigabe (GitHub Environment Protection) ─
  terraform-prod:
    name: "Terraform Prod"
    runs-on: ubuntu-latest
    environment: prod    # → GitHub Environment "prod" mit Required Reviewers
    needs: terraform-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan & Apply
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan
          terraform apply tfplan
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID_PROD }}
          TF_VAR_entra_audience: ${{ secrets.ENTRA_AUDIENCE_PROD }}
          TF_VAR_web_entra_client_id: ${{ secrets.WEB_ENTRA_CLIENT_ID_PROD }}
          TF_VAR_web_entra_scope: ${{ secrets.WEB_ENTRA_SCOPE_PROD }}
          TF_VAR_acr_login_server: ${{ secrets.ACR_LOGIN_SERVER }}
          TF_VAR_acr_id: ${{ secrets.ACR_ID }}
          TF_VAR_log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          TF_VAR_github_sp_object_id: ${{ secrets.GITHUB_SP_OBJECT_ID }}
